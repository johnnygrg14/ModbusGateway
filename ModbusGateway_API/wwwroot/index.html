<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Modbus Gateway</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Modbus Gateway</h1>

    <div class="main-container">

        <div class="connections-section">

            <h2>Connection Management</h2>

            <div id="activeConnectionsSection">

                <button id="createConnection">
                    Create connection
                </button>

                <button id="disconnectAll">
                    Disconnect all
                </button>

                <h3>Active Connections</h3>

                <div id="connectionsList">
                    <p>Loading connections...</p>
                </div>

            </div>

            <div id="createConnectionSection">
                <h3>Create a new connection</h3>

                <div id="protocolGroup" class="form-group">
                    <label for="protocol">Protocol</label>
                    <select id="protocol"></select>
                </div>

                <div id="comGroup" class="form-group">
                    <label for="comPort">COM Port</label>
                    <input id="comPort" type="text" value="COM1">
                </div>

                <div id="baudGroup" class="form-group">
                    <label for="baudRate">Baud Rate</label>
                    <select id="baudRate"></select>
                </div>

                <div id="parityGroup" class="form-group">
                    <label for="parity">Parity</label>
                    <select id="parity">
                    </select>
                </div>

                <div id="dataBitsGroup" class="form-group">
                    <label for="dataBits">Data Bits</label>
                    <select id="dataBits">
                    </select>
                </div>

                <div id="stopBitsGroup" class="form-group">
                    <label for="stopBits">Stop Bits</label>
                    <select id="stopBits"></select>
                </div>

                <button id="cancelButton">
                    Cancel
                </button>

                <button id="connect">
                    Connect
                </button>

            </div>

        </div>

        <div class="vertical-divider"></div>

        <div id="modbusSection" class="modbus-section">

            <h2>Modbus Operations</h2>

            <fieldset id="modbusFields" disabled>
                <div id="functionSelect" class="form-group">
                    <label for="function">Function</label>
                    <select id="function"></select>
                </div>

                <div id="deviceGroup" class="form-group">
                    <label for="deviceId">Slave ID</label>
                    <input id="deviceId" type="number" value="1">
                </div>

                <div id="addressGroup" class="form-group">
                    <label for="address">Address</label>
                    <input id="address" type="number" value="0">
                </div>

                <div id="countGroup" class="form-group">
                    <label for="count">Count</label>
                    <input id="count" type="number" value="1">
                </div>

                <div id="valueGroup" class="form-group">
                    <label for="value">Value</label>
                    <input id="value" type="number">
                    <select id="coilValue">
                        <option value="true">True</option>
                        <option value="false">False</option>
                    </select>
                </div>

                <div id="valuesGroup" class="form-group">
                    <label for="values">Values</label>
                    <input id="values" type="text">
                </div>

                <p id="validationError" class="error-message" hidden></p>

                <button id="sendButton">
                    Send Request
                </button>
            </fieldset>

        </div>

    </div>

    <div id="responseSection">

        <div id="responseGroup" class="form-group">
            <label for="response">Response</label>
            <textarea id="response"
                      rows="15"
                      readonly>
            </textarea>
        </div>

        <button id="clearResponse">
            Clear response
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
